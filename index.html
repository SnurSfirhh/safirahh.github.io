<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Fifiy's Website</title>
 
  <style>
    *{
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body{
      height: 100vh;
      background-image: url("img/TanjungDawai.jpg"); 
      background-size: cover;
      background-position: center;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* NAVBAR */
    .navbar{
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 20px;
      background: rgba(0,0,0,0.3);
      padding: 15px 30px;
      border-radius: 40px;
      backdrop-filter: blur(5px);
    }

    /* BUTTON NAVBAR */
    .navbar a{
      text-decoration: none;
      color: white;
      font-size: 15px;
      background: rgba(255,255,255,0.15);
      padding: 10px 18px;
      border-radius: 20px;
      transition: 0.3s;
      backdrop-filter: blur(5px);
    }

    .navbar a:hover{
      background: #c084fc;
      transform: translateY(-2px);
    }

    /* CLOCK + DATE */
    .datetime{
      color: white;
      text-align: center;
      font-size: 13px;
      background: rgba(255,255,255,0.15);
      padding: 10px 15px;
      border-radius: 20px;
    }

    #clock{
      font-size: 15px;
      margin-bottom: 4px;
    }

    #calendar{
      border: none;
      padding: 4px;
      border-radius: 10px;
      background: rgba(255,255,255,0.2);
      color: white;
      margin-top: 5px;
    }

    .home{
      text-align: center;
      color: white;
      background: rgba(0,0,0,0.3);
      padding: 40px;
      border-radius: 20px;
      backdrop-filter: blur(4px);
    }

    .home h1{
      font-size: 55px;
      margin-bottom: 10px;
    }

    .home p{
      font-size: 20px;
      margin-bottom: 25px;
    }

    .btn{
      text-decoration: none;
      color: white;
      background: #c084fc;
      padding: 12px 28px;
      border-radius:30px;
      transition: 0.3s;
      font-size: 16px;
      position: relative;
      overflow: hidden;
    }

    .btn:hover{
      background: #a855f7;
    }

    /* FLASH EFFECT */
    .btn:active::after{
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(255,255,255,0.6);
      animation: flash 0.3s ease;
      border-radius: 30px;
    }

    @keyframes flash{
      from{opacity: 1;}
      to{opacity: 0;}
    }
  </style>
</head>

<body>

    <!-- NAVBAR -->
    <div class="navbar">
      <a href="home.html">Home</a>
      <a href="About me.html">Aboutme</a>
      <a href="Personal Interests.html">My Collection</a>
      <a href="MyMusic.html">My Symphony</a>
      <a href="education.html">Education</a>
      <a href="family.html">Family</a>
      <a href="Contact.html">Contact ME</a>

      <!-- DATE TIME -->
      <div class="datetime">
        <div id="clock"></div>
        <div id="day"></div>
        <div id="date"></div>
        <input type="date" id="calendar">
      </div>
    </div>

    <div class="home">
      <h1>Hello!, I'm Fifiy 𐙚♡</h1>
      <p>This is my little website🪼⋆｡𖦹°🫧⋆.ೃ꙳✿⃘ ᩚ ⋆｡</p>

      <!-- BUTTON DISCOVER -->
      <a href="About me.html" class="btn">Discover My World</a>
    </div>

  <!-- CLOCK SCRIPT -->
  <script>
    function updateClock(){
      let now = new Date();
      let hours = now.getHours().toString().padStart(2, '0');
      let minutes = now.getMinutes().toString().padStart(2, '0');
      let seconds = now.getSeconds().toString().padStart(2, '0');

      document.getElementById("clock").innerHTML =
      hours + ":" + minutes + ":" + seconds;

      let days = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
      document.getElementById("day").innerHTML = days[now.getDay()];
      document.getElementById("date").innerHTML = now.toLocaleDateString();
    }

    setInterval(updateClock,1000);
    updateClock();
  </script>

</body>
</html>
